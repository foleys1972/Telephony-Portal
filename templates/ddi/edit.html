## ddi/edit.html - Edit DDI Number

{% extends "base.html" %}

{% block title %}Edit DDI Number - Telephony Management{% endblock %}

{% block header %}Edit DDI Number{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">DDI Number Details</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="ddi_number" class="form-label">DDI Number</label>
                            <input type="text" class="form-control" id="ddi_number" value="{{ ddi.ddi_number }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{ ddi.username }}">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="cisco_cluster" class="form-label">Cisco Cluster</label>
                            <select class="form-select" id="cisco_cluster" name="cisco_cluster">
                                <option value="">Select Cisco Cluster</option>
                                {% for c in cisco_clusters %}
                                <option value="{{ c }}" {% if ddi.cisco_cluster == c %}selected{% endif %}>{{ c }}</option>
                                {% endfor %}
                                {% if ddi.cisco_cluster and ddi.cisco_cluster not in cisco_clusters %}
                                <option value="{{ ddi.cisco_cluster }}" selected>{{ ddi.cisco_cluster }} (not in dropdown)</option>
                                {% endif %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="tpo" class="form-label">TPO</label>
                            <select class="form-select" id="tpo" name="tpo">
                                <option value="">Select TPO</option>
                                {% for t in tpo_options %}
                                <option value="{{ t }}" {% if ddi.tpo == t %}selected{% endif %}>{{ t }}</option>
                                {% endfor %}
                                {% if ddi.tpo and ddi.tpo not in tpo_options %}
                                <option value="{{ ddi.tpo }}" selected>{{ ddi.tpo }} (not in dropdown)</option>
                                {% endif %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="bt_system" class="form-label">BT System</label>
                            <select class="form-select" id="bt_system" name="bt_system">
                                <option value="">Select BT System</option>
                                {% for system in bt_systems %}
                                <option value="{{ system }}" {% if ddi.bt_system == system %}selected{% endif %}>{{ system }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="location" class="form-label">Location</label>
                            <select class="form-select" id="location" name="location" required>
                                <option value="">Select Location</option>
                                {% for loc in locations %}
                                <option value="{{ loc }}" {% if ddi.location == loc %}selected{% endif %}>{{ loc }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Active" {% if ddi.status == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Spare" {% if ddi.status == 'Spare' %}selected{% endif %}>Spare</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Date Created</label>
                            <input type="text" class="form-control" value="{{ ddi.date_created.strftime('%Y-%m-%d %H:%M:%S') }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Updated</label>
                            <input type="text" class="form-control" value="{{ ddi.last_updated.strftime('%Y-%m-%d %H:%M:%S') }}" disabled>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-12">
                            <label class="form-label">Last Change</label>
                            <input type="text" class="form-control" value="{{ ddi.last_change }}" disabled>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('ddi_list') }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
